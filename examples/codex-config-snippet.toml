# Append (or merge) into ~/.codex/config.toml.
# Adds tinyctx as a model_provider + a profile + the recommended MCP servers.

[model_providers.tinyctx]
name = "tinyctx local-first router"
base_url = "http://127.0.0.1:4141/v1"
wire_api = "responses"
request_max_retries = 4
stream_max_retries = 10
stream_idle_timeout_ms = 300000
# Codex's existing Authorization header is forwarded to the upstream the proxy
# chooses (frontier path). Local path uses the local backend's auth (or none).

[profiles.tinyctx]
model_provider = "tinyctx"
model = "tinyctx-auto"
model_context_window = 400000
model_auto_compact_token_limit = 64000

# Long-running `/goal` profile. Use only for trusted projects because it
# keeps working without approval prompts and has full filesystem access.
[profiles.tinyctx-goal]
model_provider = "tinyctx"
model = "tinyctx-auto"
model_context_window = 1050000
model_auto_compact_token_limit = 997500
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "danger-full-access"
features = { goals = true }

# tinyctx routing strategy for `/goal`: keep ordinary executor turns on the
# cheap model, but route goal-contract creation, done_when validation,
# completion audits, and blocker/pivot judgments to frontier.
# Put this in ~/.tinyctx/config.toml, not ~/.codex/config.toml:
#
# [routing]
# goal_control_frontier_enabled = true


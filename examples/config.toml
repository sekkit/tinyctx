# tinyctx config.
# Copy to ~/.tinyctx/config.toml and edit. Env vars (TINYCTX_*) override file.

[server]
host = "127.0.0.1"
port = 4141
verbose = true

[routing]
# Compaction handoff prompts always go to the local model. Highest-leverage win.
redirect_compaction_to_local = true
sanitize_encrypted_content = true

# Above this estimated input-token count, escalate to frontier.
escalate_input_tokens = 60000
# After this many turns in a session, escalate.
escalate_turn_count = 15
# Two consecutive upstream errors -> next request escalates.
escalate_on_error_streak = 2

# "auto" | "local" | "frontier" — debugging override.
force_route = "auto"


# ─────────────────────────── [local] backend ────────────────────────────
# Pick exactly ONE of the four blocks below. Comment out the others.

# ── (A) LMStudio with /v1/responses native (recommended for local GPU) ──
# Pros: free (your hardware); supports Responses API natively;
#       no chat→responses translation needed.
# Cons: slow on consumer Macs (qwen3.6-27b ~3 min/turn at xhigh reasoning).
[local]
base_url = "http://127.0.0.1:1234/v1"
wire_api = "responses"
model = "qwen3.6-27b-crack"
api_key_env = "TINYCTX_LOCAL_API_KEY"   # LMStudio ignores; set anyway for portability
timeout_s = 180
# Drives the "escalate when local can't fit" routing branch — the router
# escalates only when est_tokens > context_window * context_safe_fraction.
# Set to whatever your loaded model actually supports.
context_window = 262144            # qwen3.6-27b-crack 256K build (adjust per build)
context_safe_fraction = 0.85

# ── (B) DeepSeek API (chat-completions only — proxy translates) ──
# Pros: ~5–7 s/turn vs ~3 min local; reasoning_content preserved through
#       roundtrip; deepseek-v4-flash is very cheap.
# Cons: $$ (small); requires API key in ~/.tinyctx/secrets.env.
# To use:
#   1. Copy examples/secrets.env.example → ~/.tinyctx/secrets.env
#   2. chmod 600 ~/.tinyctx/secrets.env
#   3. Replace the placeholder with your DeepSeek API key
#   4. Switch to this [local] block (comment out the LMStudio one above)
#   5. tinyctx-up restart
#
# [local]
# base_url = "https://api.deepseek.com/v1"
# wire_api = "chat"                       # DeepSeek is chat-completions only
# model = "deepseek-v4-flash"             # or deepseek-v4-pro
# api_key_env = "TINYCTX_LOCAL_API_KEY"   # value lives in secrets.env
# timeout_s = 180
# context_window = 1000000                # v4-flash and v4-pro both 1M input
# context_safe_fraction = 0.85            # escalate at ~850K input

# ── (C) Ollama (chat-completions, no reasoning_content) ──
# [local]
# base_url = "http://127.0.0.1:11434/v1"
# wire_api = "chat"
# model = "qwen2.5-coder:32b"
# api_key_env = "TINYCTX_LOCAL_API_KEY"   # Ollama ignores
# timeout_s = 180

# ── (D) vLLM / SGLang serving Responses API ──
# [local]
# base_url = "http://127.0.0.1:8000/v1"
# wire_api = "responses"
# model = "Qwen/Qwen2.5-Coder-32B-Instruct"
# api_key_env = "TINYCTX_LOCAL_API_KEY"
# timeout_s = 180


[frontier]
# Default = the codex backend itself. Codex's auth header is forwarded
# unchanged when api_key_env is unset, so login state still works.
base_url = "https://chatgpt.com/backend-api/codex"
wire_api = "responses"
model = "gpt-5.5"
api_key_env = "TINYCTX_FRONTIER_API_KEY"   # leave unset to forward codex auth
timeout_s = 300

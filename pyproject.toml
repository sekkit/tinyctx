[project]
name = "tinyctx"
version = "0.7.0"
description = "Codex CLI Responses-API context-routing proxy: local cheap by default, frontier on demand"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tinyctx" }]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn[standard]>=0.27",
    "tomli>=2.0;python_version<'3.11'",
]

[project.optional-dependencies]
compress = ["llmlingua>=0.2"]
mem = ["mem0ai"]

[project.scripts]
tinyctx = "tinyctx.installer:main"
tinyctx-proxy = "tinyctx.proxy:main"
tinyctx-scout = "tinyctx.scout:main"
tinyctx-stats = "tinyctx.stats:main"
tinyctx-interest = "tinyctx.interest:main"
tinyctx-recall = "tinyctx.continuity:main"
tinyctx-keypin = "tinyctx.keypin:main"
tinyctx-mem = "tinyctx.memory:main"
tinyctx-dreamer = "tinyctx.dreamer:main"
tinyctx-trace = "tinyctx.trace:main"
tinyctx-gitnexus = "tinyctx.gitnexus_bootstrap:main"
tinyctx-graphify = "tinyctx.graphify_bootstrap:main"
tinyctx-serena = "tinyctx.serena_bootstrap:main"
tinyctx-caveman = "tinyctx.caveman_bootstrap:main"
tinyctx-scout-hook = "tinyctx.scout_hook_bootstrap:main"
tinyctx-trigger = "tinyctx.scout_trigger:main"
tinyctx-chunker = "tinyctx.ast_chunker:main"
tinyctx-lingua = "tinyctx.lingua:main"
tinyctx-context-mode = "tinyctx.context_mode_bootstrap:main"
tinyctx-pydoc-mcp = "tinyctx.pydoc_mcp_bootstrap:main"
tinyctx-codex-profile = "tinyctx.codex_profile_bootstrap:main"
tinyctx-advisor-bootstrap = "tinyctx.advisor_bootstrap:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tinyctx*"]

[tool.setuptools.package-data]
# Ship the bundled prompt templates with the wheel/sdist so a fresh
# `pip install tinyctx` includes ~/.codex/AGENTS.md content for runtime
# injection. Without this entry, `tinyctx/templates/*.md` would be left
# out of distribution builds.
"tinyctx" = ["templates/*.md"]
